<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全屏点击效果演示</title>
    
    <style>
        /* ---------------------------------- */
        /* CSS 样式部分 */
        /* ---------------------------------- */
        
        /* 基础设置，确保全屏和无滚动条 */
        body { 
            margin: 0; 
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
            background-color: #f4f4f4;
            color: #333;
            cursor: pointer; /* 提示用户可以点击 */
        }
        
        h1 {
            padding: 20px;
            text-align: center;
        }

        /* 定义点击效果元素的初始样式 */
        .click-effect {
            position: absolute; /* 绝对定位，脱离文档流，精确控制位置 */
            width: 50px;
            height: 50px;
            border-radius: 50%; /* 圆形 */
            background-color: rgba(66, 133, 244, 0.7); /* 蓝色半透明 */
            pointer-events: none; /* 关键：确保它不捕获点击事件，允许点击下方的元素 */
            transform: scale(0); /* 初始状态：完全缩小 */
            transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94), opacity 0.6s ease-out; 
            z-index: 9999; /* 确保它在最上层 */
        }

        /* 动画结束状态（通过 JS 添加此 class 触发动画） */
        .click-effect.animate {
            transform: scale(5); /* 放大 5 倍 */
            opacity: 0; /* 渐隐消失 */
        }
    </style>
</head>
<body>

    <h1>✨ 点击页面任意位置，感受点击波纹！ ✨</h1>

    <script>
        /* ---------------------------------- */
        /* JavaScript 逻辑部分 */
        /* ---------------------------------- */
        
        // 监听整个文档的点击事件
        document.addEventListener('click', function(event) {
            
            // 1. 获取点击的精确坐标
            const x = event.clientX; // 视口 X 坐标
            const y = event.clientY; // 视口 Y 坐标
            
            // 2. 创建效果元素
            const effectElement = document.createElement('div');
            effectElement.classList.add('click-effect');

            // 3. 定位元素
            // 效果元素的尺寸是 50px，所以要减去 25px (一半) 来确保点击点在圆心
            const size = 50; 
            effectElement.style.left = `${x - size / 2}px`;
            effectElement.style.top = `${y - size / 2}px`;

            // 4. 添加到 DOM
            document.body.appendChild(effectElement);

            // 5. 延迟应用 'animate' class，以确保浏览器能识别 transform 的初始状态 (scale(0))
            setTimeout(() => {
                effectElement.classList.add('animate');
            }, 10); 

            // 6. 动画结束后，移除元素以清理 DOM
            // 动画时间是 0.6s，我们等待 700ms 确保动画完成
            effectElement.addEventListener('transitionend', function() {
                effectElement.remove();
            });
            
            // 额外的清理：如果 transitionend 没有触发 (例如动画被中断)，在延迟后也移除
            setTimeout(() => {
                if (effectElement.parentNode) {
                    effectElement.remove();
                }
            }, 700); 
        });
    </script>
</body>
</html>
